[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algofactory"
version = "0.0.1"
description = "Knowledge and validation driven algorithm factory prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
algofactory = "algofactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
