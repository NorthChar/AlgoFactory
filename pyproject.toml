[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "algofactory"
version = "0.7.1"
description = "Knowledge and validation driven algorithm factory prototype"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "networkx>=3.4,<4", "scikit-learn>=1.5,<2", "pandas>=2.2,<3", "numpy>=2,<3"]

[project.optional-dependencies]
web = ["streamlit>=1.46,<2", "graphviz>=0.20,<1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "setuptools==84.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: real Docker sandbox integration tests (enable with ALGOFACTORY_DOCKER_TESTS=1)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[project.scripts]
algofactory = "algofactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"algofactory.llm" = ["fixtures/*.json"]
"algofactory.generation" = ["templates/*.txt"]
